name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supply-chain baseline (homelab-governance, 2026-10-20): every action pinned to a full commit SHA with its tag as a
# comment, every tool by exact version, checkouts keep no token. The workflow grants nothing; each job asks for exactly
# what it needs.
permissions: {}
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true } # a newer push supersedes a running check

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pyrtlsdr loads librtlsdr and sounddevice loads PortAudio; the tests use a mock radio, so no SDR is needed
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librtlsdr-dev libportaudio2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          enable-cache: false # no lockfile to key a cache on
      - run: uv sync --all-extras --python 3.12
      - run: uvx ruff@0.16.10 check .
      - run: uv run pytest
      # The wheel must carry adws: rfad-watch imports it, and outside a checkout nothing else provides it
      - name: Installed wheel runs rfad-watch
        run: |
          uv build --wheel -o "$RUNNER_TEMP/dist"
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" "$(ls "$RUNNER_TEMP"/dist/*.whl)[watch]"
          cd "$RUNNER_TEMP"
          wheel-venv/bin/rfad-watch --help
          wheel-venv/bin/python -I -c "import adws.adw_spectrum_watch"

  zizmor:
    # security audit of the workflows (config: .github/zizmor.yml). The action runs zizmor's container image by
    # version and digest (its support/versions list); results go to the log, not to code scanning.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: "1.30.1"
          advanced-security: false
